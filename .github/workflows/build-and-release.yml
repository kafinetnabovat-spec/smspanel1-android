name: Build APK & Plugin

# یک ورک‌فلو — یک ریلیز در هر پوش (قبلاً دو ورک‌فلو موازی هر پوش را دو بار ریلیز می‌کرد)
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Read versions
        id: ver
        run: |
          APP_VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          PLG_VER=$(grep -oP 'Version:\s+\K[0-9]+\.[0-9]+\.[0-9]+' wordpress-plugin/mahdinikzad-sms-gateway/mahdinikzad-sms-gateway.php | head -1)
          echo "app=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "plugin=$PLG_VER" >> "$GITHUB_OUTPUT"
          echo "App: $APP_VER  Plugin: $PLG_VER"

      # اگر Secret کی‌استور ست شده باشد، APK ریلیزِ امضاشده ساخته می‌شود؛
      # وگرنه APK دیباگ (برای اینکه بیلد هیچ‌وقت شکست نخورد).
      - name: Decode keystore
        id: ks
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "have=yes" >> "$GITHUB_OUTPUT"
          echo "کی‌استور آماده شد"

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.ks.outputs.have }}" = "yes" ]; then
            echo "==> بیلد ریلیز امضاشده"
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::KEYSTORE_BASE64 ست نشده — APK دیباگ ساخته می‌شود. امضای بیلدهای دیباگ در هر اجرا فرق می‌کند و آپدیت روی نسخه‌ی قبلی نصب نمی‌شود."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then APK=$(ls app/build/outputs/apk/debug/*.apk | head -1); fi
          cp "$APK" "dist/smspanel1-v${{ steps.ver.outputs.app }}.apk"
          ( cd wordpress-plugin && zip -r "../dist/mahdinikzad-sms-gateway-${{ steps.ver.outputs.plugin }}.zip" mahdinikzad-sms-gateway )
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.app }}-build.${{ github.run_number }}
          name: SmsPanel1 v${{ steps.ver.outputs.app }} + پلاگین ${{ steps.ver.outputs.plugin }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.zip
