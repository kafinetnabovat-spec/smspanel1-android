name: Build APK

on:
  push:
    branches: [main, master, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon 2>&1 | tee gradle-check.log
      - name: Summarize checks
        if: always()
        run: python3 scripts/ci_summary.py
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smspanel1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            gradle-check.log
          if-no-files-found: ignore
